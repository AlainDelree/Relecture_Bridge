<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Relecture</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="mise-en-page">
  <nav class="barre-laterale">
    <p class="barre-laterale__titre">Projets</p>
    <ul class="barre-laterale__liste">
      {% for p in projets_sidebar %}
      <li>
        <a href="{{ url_for('projet_route', nom_projet=p.nom) }}"
           class="barre-laterale__lien{{ ' barre-laterale__lien--actif' if p.nom == nom_projet_actif else '' }}">
          {% if p.couleur %}<span class="pastille-couleur" style="background:{{ p.couleur }};"></span>{% endif %}
          {{ p.nom }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>
  <div class="contenu-principal{% block classe_contenu %}{% endblock %}">
    {% block body %}{% endblock %}
  </div>
</div>

<div id="modal-confirmation" class="modal-confirmation" hidden>
  <div class="modal-confirmation__panneau" role="alertdialog" aria-modal="true" aria-labelledby="modal-confirmation-titre">
    <p class="modal-confirmation__bandeau-projet" id="modal-confirmation-bandeau" hidden></p>
    <p class="modal-confirmation__avertissement" id="modal-confirmation-avertissement" hidden></p>
    <p class="modal-confirmation__titre" id="modal-confirmation-titre"></p>
    <pre class="modal-confirmation__commande" id="modal-confirmation-commande"></pre>
    <div class="modal-confirmation__boutons">
      <button type="button" class="bouton bouton--annuler" id="modal-confirmation-annuler">Annuler</button>
      <button type="button" class="bouton" id="modal-confirmation-confirmer"></button>
    </div>
  </div>
</div>

<script>
// Fenêtre de confirmation propre à relecture_web (issue #71, raccourcie et
// unifiée par l'issue #73) : deux variantes visuelles selon `options.variant`
// ("forte" par défaut — couleur d'alerte rouge, actions difficiles à
// défaire ; "legere" — variante neutre non rouge, remplace les confirm()
// natifs pour pouvoir raccourcir et colorer les messages de façon uniforme).
// Dans les deux cas : une seule ligne principale (options.message, au format
// "Action + objet + projet"), un avertissement optionnel affiché en premier
// et mis en évidence (options.avertissement, ex. bloc(s) vide(s)), la
// commande git équivalente en petit texte discret sous la ligne principale,
// un bandeau à la couleur du projet quand elle est configurée (issue #73),
// le bouton de validation nommé d'après l'action réelle (jamais un OK
// générique), et le focus par défaut sur Annuler.
function ouvrirConfirmation(options) {
  var modal = document.getElementById("modal-confirmation");
  var bandeau = document.getElementById("modal-confirmation-bandeau");
  var avertissement = document.getElementById("modal-confirmation-avertissement");
  var titre = document.getElementById("modal-confirmation-titre");
  var texteCommande = document.getElementById("modal-confirmation-commande");
  var boutonAnnuler = document.getElementById("modal-confirmation-annuler");
  var boutonConfirmer = document.getElementById("modal-confirmation-confirmer");

  var estForte = options.variant !== "legere";
  modal.classList.toggle("modal-confirmation--forte", estForte);

  if (options.nomProjet && options.couleurProjet) {
    bandeau.textContent = options.nomProjet;
    bandeau.style.background = options.couleurProjet;
    bandeau.style.color = options.couleurTexteProjet || "#000000";
    bandeau.hidden = false;
  } else {
    bandeau.hidden = true;
  }

  avertissement.textContent = options.avertissement || "";
  avertissement.hidden = !options.avertissement;

  titre.textContent = (estForte ? "⚠ " : "") + (options.message || "");

  var commandes = Array.isArray(options.commandes) ? options.commandes.join("\n") : (options.commandes || "");
  texteCommande.textContent = commandes;
  texteCommande.hidden = !commandes;

  boutonConfirmer.textContent = options.libelleBouton;
  boutonConfirmer.className = "bouton " + (estForte ? "bouton--danger" : "bouton--confirmer-legere");

  function fermer() {
    modal.hidden = true;
    boutonConfirmer.removeEventListener("click", surConfirmer);
    boutonAnnuler.removeEventListener("click", surAnnuler);
    document.removeEventListener("keydown", surTouche);
  }
  function surConfirmer() {
    fermer();
    options.onConfirmer();
  }
  function surAnnuler() {
    fermer();
  }
  function surTouche(evenement) {
    if (evenement.key === "Escape") fermer();
  }

  boutonConfirmer.addEventListener("click", surConfirmer);
  boutonAnnuler.addEventListener("click", surAnnuler);
  document.addEventListener("keydown", surTouche);

  modal.hidden = false;
  boutonAnnuler.focus();
}

(function () {
  function copierAncienneMethode(texte) {
    var zone = document.createElement("textarea");
    zone.value = texte;
    zone.style.position = "fixed";
    zone.style.opacity = "0";
    document.body.appendChild(zone);
    zone.focus();
    zone.select();
    document.execCommand("copy");
    document.body.removeChild(zone);
  }

  document.addEventListener("click", function (evenement) {
    var bouton = evenement.target.closest(".bouton-copier");
    if (!bouton) return;
    evenement.preventDefault();
    evenement.stopPropagation();

    var texte = bouton.dataset.copier || "";
    var original = bouton.textContent;

    function confirmerCopie() {
      bouton.textContent = "✓";
      bouton.classList.add("bouton-copier--copie");
      setTimeout(function () {
        bouton.textContent = original;
        bouton.classList.remove("bouton-copier--copie");
      }, 1200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte).then(confirmerCopie, function () {
        copierAncienneMethode(texte);
        confirmerCopie();
      });
    } else {
      copierAncienneMethode(texte);
      confirmerCopie();
    }
  });
})();
</script>
</body>
</html>
