# Branche cible de comparaison, par projet (issue #20).
#
# Sert de référence pour savoir si un commit orphelin ou en attente est déjà
# intégré — utile quand un projet travaille sur une branche de développement
# avant de merger vers sa branche principale (main/master), qui donnerait
# sinon un écart de commits trompeur si on comparait contre elle directement.
#
# Format : une ligne par projet, `nom_projet = branche`.
# - nom_projet : le champ "nom" de BRIDGE_AGENT_DOC.md (ex. "ff_galerie"),
#   pas le nom de dossier ni le nom du dépôt GitHub.
# - branche : le nom de la branche à utiliser comme cible de comparaison.
#
# Un projet absent de ce fichier n'a pas de surcharge : sa branche
# principale git (celle du worktree racine) reste la référence, comme avant
# cette issue.

ff_galerie = dev
