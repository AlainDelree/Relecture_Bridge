# Configuration du PC fixe Windows (CCW), pour le routage SSH des commandes
# git de projets distants (issue #94).
#
# Un seul PC physique héberge tous les projets CCW (chemins locaux du type
# C:\CCW\<NomProjet>), pas toujours allumé — une seule entrée suffit.
#
# Format : `cle = valeur`, une entrée par ligne, `#` pour les commentaires.
# - ccw_host : utilisateur@hôte (ou IP locale) du PC fixe pour la connexion
#   SSH, ex. AlainW@192.168.1.50
# - ccw_key  : chemin de la clé SSH privée à utiliser (optionnel — par
#   défaut ~/.ssh/ccl_ccw, la clé déjà en place côté ThinkPad)
#
# Tant que `ccw_host` n'est pas renseigné ci-dessous, aucun projet n'est
# considéré comme distant pour la connexion SSH elle-même (la détection
# « projet distant » via le format du répertoire C:\... reste, elle,
# indépendante de cette config — voir est_projet_distant) : toute tentative
# de commande git sur un tel projet échoue proprement faute d'hôte configuré,
# plutôt que d'échouer avec une erreur SSH confuse.
#
# Ce fichier suit le même statut que branches_cibles.conf : CCL ne le
# modifie jamais de sa propre initiative une fois l'entrée ccw_host
# renseignée — seul Alain l'édite à la main.

# ccw_host = AlainW@<ip-locale>
# ccw_key = ~/.ssh/ccl_ccw
